<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://img.icons8.com/?size=100&id=NvAez9zuZg1W&format=png&color=000000">
  <title>AETHER RUNNER MENU</title>
  <style>
  @keyframes slideUp{
    from{opacity:0;transform:translateY(40px)}
    to{opacity:1;transform:translateY(0)}
  }
  .popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
}
.popup-content {
    background: white;
    box-shadow: #ffffff 0px 5px 10px;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    animation: slideUp .9s cubic-bezier(.16,1,.3,1) .30s both;
}
.popup :hover {
    box-shadow: #000000 0px 5px 10px;
}
  h1{
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(42px, 8vw, 75px);
    font-weight: 900;
    color: #1a2a4a;
    text-transform: uppercase;
    letter-spacing: clamp(4px, 1vw, 12px);
    line-height: 1.05;
    text-align: center;
    text-shadow: #fff 1px 1px 10px;
    animation: slideUp .7s cubic-bezier(.16,1,.3,1) .25s both;
}
h2{
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(36px, 6vw, 60px);
    font-weight: 700;
    color: #1a2a4a;
    text-shadow: #fff 1px 1px 10px;
    text-transform: uppercase;
    letter-spacing: clamp(4px, 1vw, 12px);
    line-height: 1.05;
    text-align: center;
    animation: slideUp .8s cubic-bezier(.16,1,.3,1) .30s both;
}
h3{
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 900;
    color: #1a2a4a;
    text-transform: uppercase;
    letter-spacing: clamp(4px, 1vw, 12px);
    line-height: 1.05;
    text-align: center;
    text-shadow: #fff 1px 1px 10px;
    animation: slideUp .9s cubic-bezier(.16,1,.3,1) .35s both;
}
#button1{
  box-Shadow: #ffffff 0px 5px 10px;
  display: inline-block;
  margin: 20px 10px;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background-color: #1a2a4a;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color .3s ease, transform .3s ease;
  animation: slideUp .9s cubic-bezier(.16,1,.3,1) .40s both;
}
#button2{
  box-Shadow: #ffffff 0px 5px 10px;
  display: inline-block;
  margin: 20px 10px;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background-color: #1a2a4a;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color .3s ease, transform .3s ease;
  animation: slideUp .9s cubic-bezier(.16,1,.3,1) .45s both;
}
#button3{
  box-Shadow: #ffffff 0px 5px 10px;
  display: inline-block;
  margin: 20px 10px;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background-color: #1a2a4a;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color .3s ease, transform .3s ease;
  animation: slideUp .9s cubic-bezier(.16,1,.3,1) .50s both;
}
#button1:hover, #button2:hover, #button3:hover {
  scale: 1.08;
  translate: 0 -3px; 
  box-shadow: #000000 0px 5px 10px;
  background-color: #3a4a6a;
}

#audiobutton{
  box-Shadow: #ffffff 0px 5px 10px;
  transition: transform .3s ease, box-shadow .3s ease;
  animation: slideUp .9s cubic-bezier(.16,1,.3,1) .55s both;
  background-color: transparent;

}
#audiobutton:hover{
  scale: 1.08;
  translate: 0 -3px;
  box-Shadow: #000000 0px 5px 10px;
}
#background_video{
  top: 0;
  left: 0;
  object-fit: cover;
  width:100vw;
  height:100vh;
  position: fixed;
  z-index: -1;
}
#coins{
  animation: slideUp .9s cubic-bezier(.16,1,.3,1) .60s both;
}
</style>

</head>
<body>
  <h1>AETHER</h1>
  <h2>RUNNER</h2>
  <h3>MENU</h3>

  <div>
    <p style="font-size: 50px; color: yellow; text-shadow: #fff 2px 2px 5px; position: absolute; top: 10px; left: 10px;" id="coins"> Coins: </p>
  </div>


  <div id="popup" class="popup">
    <div class="popup-content">
         <img id="audiobutton" src="pause.png" alt="Pause Audio" style="width: 30px; height: 30px; position: absolute; top: 10px; right: 10px;" id="audiobutton">
            <img onclick="closePopup()" id="audiobutton" src="close.png" alt="Pause Audio" style="width: 30px; height: 30px;" id="settingsbutton"> 
    </div>

  </div>

   <img onclick="openPopup()" id="audiobutton" src="settings.png" alt="Pause Audio" style="width: 30px; height: 30px; position: absolute; top: 10px; right: 10px;" id="settingsbutton"> 

  
  <audio src="u_vdwj1c20kz-game-background-sound-342336.mp3" loop id="audiofile"></audio>
  <button onclick="window.open('city-night.html', '_blank')" style="position: center;" id="button1">City-night 🌃</button>
  <button onclick="window.open('day-runner.html', '_blank')" style="position: center;" id="button2">City-day 🏙️</button>
  <button onclick="window.open('forest-runner.html', '_blank')" style="position: center;" id="button3">Forest 🌳</button>
  <video id="background_video" autoplay muted loop><source src="Pippit_20260528_GlowingRunner.mp4"></source></video>

<script>
  const audiobutton=document.getElementById("audiobutton")
  const audiofile=document.getElementById("audiofile")

  function pauseAudio(){
    audiobutton.setAttribute("src", "play.png");
    audiofile.pause();
  }
  function playAudio(){
    audiobutton.setAttribute("src", "pause.png");
    audiofile.play();
  }
  let isPlay = true;

  audiobutton.addEventListener("click",function() {
    isPlay=!isPlay;

    if(isPlay==false){
      pauseAudio();
    }
    if(isPlay==true){
      playAudio();
    }
    
  })
  function openPopup() {
    document.getElementById("popup").style.display = "flex";
  }
  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }

  let coins = localStorage.getItem("coins");
  if (coins==null){
    document.getElementById("coins").textContent =`Coins: 0`;
  }
  else {
    document.getElementById("coins").textContent =`Coins: ${parseInt(coins)}`;
  }
  

</script>
</body>
</html>
